[project]
name = "xkoranate-ce"
version = "0.4.0"
description = "xkoranate Community Edition — sports scorinator for NS Sports (Python port)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "pyqtdarktheme2>=2.1",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["mkdocs-material>=9"]

[project.gui-scripts]
xkoranate = "xkoranate.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["xkoranate*"] } }

[tool.setuptools.package-data]
xkoranate = ["icons/*.png", "icons/*.icns", "icons/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12"
pyside6 = ">=6.6"
qtawesome = ">=1.3"
pytest = ">=8"

[tool.pixi.pypi-dependencies]
xkoranate-ce = { path = ".", editable = true }

[tool.pixi.feature.build.dependencies]
pyinstaller = ">=6"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }

[tool.pixi.tasks]
run = "python -m xkoranate"
test = "pytest tests/unit -v"
test-integration = { cmd = "pytest tests/integration_test.py -v", env = { QT_QPA_PLATFORM = "offscreen" } }
test-all = { depends-on = ["test", "test-integration"] }
